plugins {
    id 'com.android.application'
}

// OpenMoHAA Android: OpenMoHAA (Medal of Honor: Allied Assault engine) for arm64 handhelds.
android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "io.github.cricastrocoli.openmohaa"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-26", "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_PROJECT_openmohaa_INCLUDE=" + file('../../native/android.cmake').absolutePath
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // personal use
        }
    }
    externalNativeBuild {
        cmake {
            path '../../src/openmohaa/CMakeLists.txt'
            version '3.31.6'
        }
    }
    packaging {
        // Libraries are unpacked on install: innoextract (libinnoextract.so) runs as a program.
        jniLibs { useLegacyPackaging = true }
    }
    lint {
        abortOnError = false
    }
}
