plugins {
    id 'com.android.application'
}

// OpenMoHAA Android: OpenMoHAA (Medal of Honor: Allied Assault engine) for arm64 handhelds.
android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "io.github.cricastrocoli.openmohaa"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 5
        versionName "1.2.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-26", "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_PROJECT_openmohaa_INCLUDE=" + file('../../native/android.cmake').absolutePath
                abiFilters 'arm64-v8a'
            }
        }
    }
    // Release signing: from android/keystore.properties (kept out of git), with
    //   storeFile=<path to the .jks>  storePassword=…  keyAlias=…  keyPassword=…
    // Without it, release builds are signed with the debug key (fine for testing only).
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path '../../src/openmohaa/CMakeLists.txt'
            version '3.31.6'
        }
    }
    packaging {
        // Libraries are unpacked on install: innoextract (libinnoextract.so) runs as a program.
        jniLibs { useLegacyPackaging = true }
    }
    lint {
        abortOnError = false
    }
}
